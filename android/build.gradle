group = "com.orangecloud.im.flutter"
version = "2.0.0"

buildscript {
    ext.kotlin_version = "1.9.0"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.1.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

// plugin 自带的本地 Maven 仓库（存放核心 AAR 二进制，核心逻辑闭源于此）
repositories {
    maven {
        url = uri("${project.projectDir}/repo")
    }
}

android {
    namespace = "com.orangecloud.im.flutter"
    compileSdk = 34

    defaultConfig {
        minSdk = 21
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}

dependencies {
    // OrangeCloud IM Android 核心 SDK（随 plugin 自带的本地 maven repo，核心逻辑闭源于 AAR）
    // pom 已声明 signalr/coroutines/gson 传递依赖，宿主会自动拉取。
    implementation "com.orangecloud.im:orangecloud-im-client:2.0.0"
}
